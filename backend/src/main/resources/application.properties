spring.application.name=pastelaria-ss

# ── De onde vêm as senhas ───────────────────────────────────────────────────
# O Spring Boot NÃO lê o .env sozinho. Esta linha manda ler o .env da raiz do
# repositório como se fosse um .properties. O caminho é relativo à pasta de onde
# o sistema é iniciado, por isso procuramos nos dois lugares possíveis:
#   .env     → iniciado da raiz do repositório (padrão do IntelliJ)
#   ../.env  → iniciado de dentro da pasta backend (terminal, mvnw)
# "optional:" = se o arquivo não existir, segue sem ele (ex.: num servidor, onde
# as variáveis vêm do sistema). Variáveis de ambiente reais têm prioridade.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── Banco de dados ──────────────────────────────────────────────────────────
# DB_URL = endereço completo do banco. Em casa não é definida e vale o padrão
# (este computador, porta 5435). No servidor (Render), aponta para o banco hospedado.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/${DB_NAME:pastelaria}}
spring.datasource.username=${DB_USERNAME:pastelaria}
# Sem valor padrão, de propósito: sem DB_PASSWORD o sistema não sobe.
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# Quem cria e altera tabelas é o Flyway. O Hibernate só confere se as classes
# @Entity batem com o banco; se não baterem, o sistema não sobe.
spring.jpa.hibernate.ddl-auto=validate
# Fecha a conexão com o banco ao fim de cada operação, não ao fim da requisição.
spring.jpa.open-in-view=false
# Grava datas em UTC. As telas e filtros convertem para America/Sao_Paulo.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ──────────────────────────────────────────────────────────────────
# Proteção extra: impede o comando "clean", que apaga o banco inteiro.
spring.flyway.clean-disabled=true

# ── Sessão e cookies ────────────────────────────────────────────────────────
# Sessão expira após 10h sem uso (um turno longo da pastelaria).
server.servlet.session.timeout=10h
# HttpOnly: o JavaScript não lê o cookie de sessão (protege contra XSS).
server.servlet.session.cookie.http-only=true
# SameSite=Lax: o navegador não envia o cookie em POSTs vindos de outros sites.
server.servlet.session.cookie.same-site=lax
# Secure: só envia o cookie por HTTPS. Desligado em casa (http://localhost);
# no servidor de verdade, com HTTPS, defina SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ── Atrás de um proxy (Render) ──────────────────────────────────────────────
# Num servidor há um "porteiro" (proxy) na frente do sistema. Sem esta linha, todo
# cliente pareceria ter o endereço do porteiro e dividiria a mesma cota do limite.
# "native": o Tomcat lê o X-Forwarded-For SÓ quando a conexão vem de um proxy da
# rede interna (endereços privados e o próprio computador). Um robô na internet que
# escreva um X-Forwarded-For falso é ignorado. Não usar "framework": ele acredita
# em qualquer um. Em casa, sem proxy, não muda nada.
server.forward-headers-strategy=native

# ── Porta ───────────────────────────────────────────────────────────────────
# O Render escolhe a porta e avisa pela variável PORT. Em casa não existe PORT e
# vale a 8080. (SERVER_PORT, usada nos testes de tela na 8099, continua mandando.)
server.port=${PORT:8080}

# ── Cardápio público ────────────────────────────────────────────────────────
# Quantos acessos por minuto cada endereço pode fazer ao cardápio público. A página
# pergunta de novo a cada poucos segundos (cerca de 6 por minuto), e vários
# clientes podem sair do mesmo endereço; 120 deixa folga. Passou disso: "tente
# de novo em instantes".
app.publico.limite-por-minuto=${LIMITE_PUBLICO_POR_MINUTO:120}

# ── Administrador inicial ───────────────────────────────────────────────────
# Usado só para criar o primeiro admin, se ele ainda não existir no banco.
# Senha vazia por padrão: sem ADMIN_PASSWORD, o primeiro start falha com aviso.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
